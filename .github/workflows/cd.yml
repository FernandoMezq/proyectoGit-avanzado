name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

jobs:
  updateversion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar version del README
        run: |
          VERSION=$(grep -oP 'AppVersion-\K[0-9]+' README.md | head -1)
          NEW_VERSION=$((VERSION + 1))
          FECHA=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s/AppVersion-$VERSION/AppVersion-$NEW_VERSION/" README.md
          echo "Fecha de actualizacion: $FECHA" >> README.md

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar version de la aplicacion"
          git push

  validate-prod:
    needs: updateversion
    runs-on: self-hosted

    steps:
      - name: Validar token de produccion
        shell: powershell
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens de produccion coinciden"
          } else {
            Write-Host "Los tokens de produccion NO coinciden"
            exit 1
          }
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}